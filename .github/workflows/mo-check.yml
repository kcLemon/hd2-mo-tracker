name: HD2 Major Order Recorder

on:
  schedule:
    # 每小时 :05 (UTC) 看一眼 MO 有没有换；GitHub 实际会延迟几分钟到十几分钟
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # 提交 state/ 里的记录

concurrency:
  group: mo-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Major Order
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python check_mo.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no change, nothing to commit"
          else
            git commit -m "record: mo change $(date -u +%FT%TZ)"
            git push
          fi
